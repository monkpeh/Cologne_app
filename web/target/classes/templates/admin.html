<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin – Cologne Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-droplet-fill me-2"></i>Cologne Advisor</a>
        <div class="navbar-nav ms-auto flex-row align-items-center gap-3">
            <a class="nav-link" href="/collection"><i class="bi bi-collection me-1"></i>Collection</a>
            <a class="nav-link" href="/add"><i class="bi bi-plus-circle me-1"></i>Add</a>
            <a class="nav-link" href="/recommend"><i class="bi bi-stars me-1"></i>Recommend</a>
            <a class="nav-link active fw-semibold" href="/admin"><i class="bi bi-shield-lock me-1"></i>Admin</a>
            <span class="navbar-text text-white-50 small" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="d-inline m-0">
                <button class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign Out
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Flash messages -->
    <div th:if="${toast}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${toast}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorToast}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorToast}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 class="fw-bold mb-1"><i class="bi bi-shield-lock me-2 text-primary"></i>Account Management</h2>
    <p class="text-muted mb-4">Manage registered users, reset passwords, and assign roles.
        <a href="/admin/fragrances" class="btn btn-sm btn-outline-primary ms-3">
            <i class="bi bi-droplet me-1"></i>Manage Fragrances
        </a>
    </p>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Username</th>
                            <th>Role</th>
                            <th>Collection</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="ps-4 fw-semibold">
                                <i class="bi bi-person-circle me-2 text-muted"></i>
                                <span th:text="${u.username}"></span>
                                <span th:if="${#authentication.name == u.username}"
                                      class="badge bg-light text-secondary ms-1">you</span>
                            </td>
                            <td>
                                <span th:if="${u.role == 'ADMIN'}"  class="badge bg-primary">
                                    <i class="bi bi-shield-fill me-1"></i>Admin
                                </span>
                                <span th:unless="${u.role == 'ADMIN'}" class="badge bg-secondary">
                                    <i class="bi bi-person me-1"></i>User
                                </span>
                            </td>
                            <td>
                                <span class="text-muted" th:text="${u.collectionIds.size()} + ' fragrances'"></span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="d-flex justify-content-end gap-2">

                                    <!-- Reset password button → opens modal -->
                                    <button class="btn btn-sm btn-outline-secondary"
                                            data-bs-toggle="modal"
                                            th:attr="data-bs-target='#resetModal' + ${u.id}">
                                        <i class="bi bi-key me-1"></i>Reset Password
                                    </button>

                                    <!-- Toggle role — disabled for self -->
                                    <form th:action="@{/admin/toggle-role/{id}(id=${u.id})}" method="post">
                                        <button class="btn btn-sm btn-outline-primary"
                                                th:disabled="${#authentication.name == u.username}"
                                                th:title="${u.role == 'ADMIN'} ? 'Demote to User' : 'Promote to Admin'">
                                            <i class="bi bi-arrow-repeat me-1"></i>
                                            <span th:text="${u.role == 'ADMIN'} ? 'Demote' : 'Promote'"></span>
                                        </button>
                                    </form>

                                    <!-- Delete — disabled for self -->
                                    <form th:action="@{/admin/delete/{id}(id=${u.id})}" method="post">
                                        <button class="btn btn-sm btn-outline-danger"
                                                th:disabled="${#authentication.name == u.username}"
                                                th:data-name="${u.username}"
                                                onclick="return confirm('Delete ' + this.dataset.name + '? This cannot be undone.')">
                                            <i class="bi bi-trash me-1"></i>Delete
                                        </button>
                                    </form>

                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer text-muted small">
            <span th:text="${users.size()}"></span> registered account(s)
        </div>
    </div>
</div>

<!-- Reset Password Modals (one per user) -->
<div th:each="u : ${users}">
    <div class="modal fade"
         th:id="'resetModal' + ${u.id}"
         tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-key me-2"></i>Reset Password —
                        <span th:text="${u.username}"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/reset-password/{id}(id=${u.id})}" method="post">
                    <div class="modal-body">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" name="newPassword" class="form-control"
                               placeholder="At least 6 characters" required minlength="6">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Set Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
