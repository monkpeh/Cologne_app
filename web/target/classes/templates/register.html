<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account – Cologne Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .auth-card { max-width: 420px; }
    </style>
</head>
<body>

<div class="d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="auth-card w-100 px-3">

        <div class="text-center mb-4">
            <i class="bi bi-droplet-fill text-primary" style="font-size:3rem"></i>
            <h2 class="fw-bold mt-2">Cologne Advisor</h2>
            <p class="text-muted">Create a new account</p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <div th:if="${errorMsg}" class="alert alert-danger py-2">
                    <i class="bi bi-exclamation-circle me-1"></i><span th:text="${errorMsg}"></span>
                </div>

                <form th:action="@{/register}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control"
                               placeholder="Choose a username" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="At least 6 characters" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" name="confirmPassword" class="form-control"
                               placeholder="Repeat your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-person-plus me-1"></i>Create Account
                    </button>
                </form>
                <p class="text-muted small mt-3 mb-0 text-center">
                    <i class="bi bi-shield-check me-1"></i>The first account registered is automatically the admin.
                </p>
            </div>
        </div>

        <p class="text-center text-muted mt-3 small">
            Already have an account?
            <a href="/login" class="fw-semibold">Sign in</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
