<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fragrances – Admin – Cologne Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: .5px; }
        .thumb { width: 48px; height: 48px; object-fit: contain; border-radius: 6px; background: #f1f5f9; }
        .thumb-placeholder { width: 48px; height: 48px; border-radius: 6px; background: #f1f5f9;
            display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-droplet-fill me-2"></i>Cologne Advisor</a>
        <div class="navbar-nav ms-auto flex-row align-items-center gap-3">
            <a class="nav-link" href="/collection"><i class="bi bi-collection me-1"></i>Collection</a>
            <a class="nav-link" href="/add"><i class="bi bi-plus-circle me-1"></i>Add</a>
            <a class="nav-link" href="/recommend"><i class="bi bi-stars me-1"></i>Recommend</a>
            <a class="nav-link" href="/stats"><i class="bi bi-bar-chart me-1"></i>Stats</a>
            <a class="nav-link active fw-semibold" href="/admin"><i class="bi bi-shield-lock me-1"></i>Admin</a>
            <span class="navbar-text text-white-50 small" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="d-inline m-0">
                <button class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign Out
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Flash messages -->
    <div th:if="${toast}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${toast}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorToast}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorToast}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="/admin" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Back to Users
            </a>
            <h2 class="fw-bold mb-0 mt-1"><i class="bi bi-droplet me-2 text-primary"></i>Fragrance Catalogue</h2>
            <p class="text-muted mb-0">Add, edit, or remove fragrances. Changes are visible to all users immediately.</p>
        </div>
        <a href="/admin/fragrances/new" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Add Fragrance
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4" style="width:56px"></th>
                        <th>Name</th>
                        <th>Brand</th>
                        <th>Scent Family</th>
                        <th>Proj.</th>
                        <th>Long.</th>
                        <th>Office</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${fragrances}">
                        <td class="ps-4">
                            <img th:if="${f.imageUrl != null and !f.imageUrl.isEmpty()}"
                                 th:src="${f.imageUrl}" th:alt="${f.name}" class="thumb">
                            <div th:unless="${f.imageUrl != null and !f.imageUrl.isEmpty()}"
                                 class="thumb-placeholder">
                                <i class="bi bi-droplet-fill text-primary opacity-25"></i>
                            </div>
                        </td>
                        <td class="fw-semibold" th:text="${f.name}"></td>
                        <td class="text-muted" th:text="${f.brand}"></td>
                        <td><span class="badge bg-secondary" th:text="${f.scentFamily}"></span></td>
                        <td th:text="${f.projection} + '/5'"></td>
                        <td th:text="${f.longevity} + '/5'"></td>
                        <td>
                            <i th:if="${f.officeSafe}" class="bi bi-check-circle-fill text-success"></i>
                            <i th:unless="${f.officeSafe}" class="bi bi-x-circle text-secondary"></i>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/fragrances/{id}/edit(id=${f.id})}"
                                   class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </a>
                                <form th:action="@{/admin/fragrances/{id}/delete(id=${f.id})}" method="post">
                                    <button class="btn btn-sm btn-outline-danger"
                                            th:data-name="${f.name}"
                                            onclick="return confirm('Delete ' + this.dataset.name + '? It will be removed from all collections.')">
                                        <i class="bi bi-trash me-1"></i>Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer text-muted small">
            <span th:text="${fragrances.size()}"></span> fragrances in catalogue
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
