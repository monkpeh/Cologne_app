<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In – Cologne Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .auth-card { max-width: 420px; }
    </style>
</head>
<body>

<div class="d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="auth-card w-100 px-3">

        <div class="text-center mb-4">
            <i class="bi bi-droplet-fill text-primary" style="font-size:3rem"></i>
            <h2 class="fw-bold mt-2">Cologne Advisor</h2>
            <p class="text-muted">Sign in to your account</p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <div th:if="${logoutMsg}" class="alert alert-success py-2">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${logoutMsg}"></span>
                </div>
                <div th:if="${successMsg}" class="alert alert-success py-2">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${successMsg}"></span>
                </div>
                <div th:if="${errorMsg}" class="alert alert-danger py-2">
                    <i class="bi bi-exclamation-circle me-1"></i><span th:text="${errorMsg}"></span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control"
                               placeholder="Enter username" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-muted mt-3 small">
            Don't have an account?
            <a href="/register" class="fw-semibold">Create one</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
