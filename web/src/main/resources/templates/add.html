<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Cologne – Cologne Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: .5px; }
        .brand-label  { font-size: .7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .star-on  { color: #f59e0b; }
        .star-off { color: #dee2e6; }
        .card { transition: box-shadow .15s; }
        .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12) !important; }
        .already-added { opacity: .65; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-droplet-fill me-2"></i>Cologne Advisor</a>
        <div class="navbar-nav ms-auto flex-row align-items-center gap-3">
            <a class="nav-link" href="/collection"><i class="bi bi-collection me-1"></i>Collection</a>
            <a class="nav-link active fw-semibold" href="/add"><i class="bi bi-plus-circle me-1"></i>Add</a>
            <a class="nav-link" href="/recommend"><i class="bi bi-stars me-1"></i>Recommend</a>
            <a class="nav-link" href="/admin" sec:authorize="hasRole('ADMIN')"><i class="bi bi-shield-lock me-1"></i>Admin</a>
            <span class="navbar-text text-white-50 small" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="d-inline m-0">
                <button class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign Out
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Toast flash message -->
    <div th:if="${toast}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${toast}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Cologne</h2>

    <!-- Search bar -->
    <form method="get" action="/add" class="mb-4">
        <div class="input-group shadow-sm">
            <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text"
                   name="q"
                   class="form-control border-start-0 ps-0"
                   placeholder="Search by brand, name or scent family…"
                   th:value="${query}"
                   autocomplete="off">
            <button class="btn btn-primary" type="submit">Search</button>
            <a th:if="${!query.isEmpty()}" href="/add" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <!-- Result count -->
    <p class="text-muted small mb-3">
        Showing <strong th:text="${fragrances.size()}"></strong> fragrances
        <span th:if="${!query.isEmpty()}"> matching "<em th:text="${query}"></em>"</span>
    </p>

    <!-- No results -->
    <div th:if="${fragrances.isEmpty()}" class="text-center py-5">
        <i class="bi bi-search text-secondary" style="font-size:3rem"></i>
        <h5 class="mt-3 text-secondary">No fragrances match your search</h5>
        <a href="/add" class="btn btn-outline-primary mt-2">Show all</a>
    </div>

    <!-- Fragrance grid -->
    <div class="row g-3" th:unless="${fragrances.isEmpty()}">
        <div class="col-sm-6 col-lg-4" th:each="f : ${fragrances}">
            <div class="card h-100 shadow-sm border-0"
                 th:classappend="${collectionIds.contains(f.id)} ? 'already-added' : ''">
                <img th:if="${f.imageUrl != null and !f.imageUrl.isEmpty()}"
                     th:src="${f.imageUrl}" th:alt="${f.name}"
                     class="card-img-top"
                     style="height:180px;object-fit:contain;background:#f8f9fa;padding:.75rem">
                <div th:unless="${f.imageUrl != null and !f.imageUrl.isEmpty()}"
                     class="d-flex align-items-center justify-content-center bg-light"
                     style="height:100px;border-radius:.375rem .375rem 0 0">
                    <i class="bi bi-droplet-fill text-primary opacity-25" style="font-size:2.5rem"></i>
                </div>
                <div class="card-body">
                    <p class="brand-label text-primary mb-1" th:text="${f.brand}"></p>
                    <h5 class="card-title fw-bold mb-1" th:text="${f.name}"></h5>
                    <span class="badge bg-secondary mb-3" th:text="${f.scentFamily}"></span>

                    <div class="mb-2">
                        <small class="text-muted me-1">Projection</small>
                        <span th:each="i : ${#numbers.sequence(1,5)}">
                            <i th:class="${i <= f.projection} ? 'bi bi-star-fill star-on' : 'bi bi-star star-off'"></i>
                        </span>
                    </div>
                    <div class="mb-2">
                        <small class="text-muted me-1">Longevity&nbsp;&nbsp;</small>
                        <span th:each="i : ${#numbers.sequence(1,5)}">
                            <i th:class="${i <= f.longevity} ? 'bi bi-star-fill star-on' : 'bi bi-star star-off'"></i>
                        </span>
                    </div>

                    <span th:if="${f.officeSafe}"  class="badge bg-success"><i class="bi bi-briefcase me-1"></i>Office Safe</span>
                    <span th:unless="${f.officeSafe}" class="badge bg-warning text-dark"><i class="bi bi-moon-stars me-1"></i>Casual / Evening</span>

                    <!-- Community average rating -->
                    <div th:if="${averageRatings.containsKey(f.id)}" class="mt-2">
                        <small class="text-muted me-1">Community</small>
                        <i class="bi bi-star-fill star-on" style="font-size:.85rem"></i>
                        <small class="fw-semibold" th:text="${#numbers.formatDecimal(averageRatings.get(f.id), 1, 1)}"></small>
                        <small class="text-muted">/5</small>
                    </div>

                    <!-- Description tooltip -->
                    <p class="text-muted small mt-2 mb-0" th:text="${f.description}"></p>
                </div>
                <div class="card-footer bg-transparent border-0 pt-0">
                    <!-- Already in collection -->
                    <button th:if="${collectionIds.contains(f.id)}"
                            class="btn btn-success btn-sm w-100" disabled>
                        <i class="bi bi-check-lg me-1"></i>In Collection
                    </button>
                    <!-- Add button -->
                    <form th:unless="${collectionIds.contains(f.id)}"
                          th:action="@{/collection/add/{id}(id=${f.id})}" method="post">
                        <input type="hidden" name="returnQuery" th:value="${query}">
                        <button class="btn btn-primary btn-sm w-100">
                            <i class="bi bi-plus-lg me-1"></i>Add to Collection
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
