server.port=8080
spring.application.name=cologne-web

# H2 file-based database — data survives server restarts
spring.datasource.url=jdbc:h2:file:./data/cologne-app
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Default admin credentials — used by DataInitializer to seed the first account
app.admin.username=admin
app.admin.password=admin123

# Path to the seed JSON file, resolved relative to the working directory (project root)
app.fragrances.json-path=web/src/main/resources/fragrances.json

# JWT — secret must be at least 32 characters for HMAC-SHA256
app.jwt.secret=CologneAdvisorSecretKeyMustBeAtLeast32CharsLongForSecurity!
app.jwt.expiry-ms=86400000